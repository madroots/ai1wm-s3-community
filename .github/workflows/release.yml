name: Release WordPress plugin

# Triggered by a version tag. release-on-merge.yml pushes that tag with
# BOT_TOKEN after a release PR lands on main. Manual re-run: workflow_dispatch
# with an existing tag.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v1.59.0
        required: true

permissions:
  contents: write
  pull-requests: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Validate tag and plugin versions
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Release tag must match vMAJOR.MINOR.PATCH: %s\n' "${TAG}" >&2
            exit 1
          fi
          node scripts/version.mjs check "${TAG#v}"

      - name: Lint PHP sources
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do
            php -l "${file}" >/dev/null
          done < <(find . -path './.git' -prune -o -name '*.php' -print0)

      - name: Build installable ZIP
        id: package
        shell: bash
        run: |
          set -Eeuo pipefail
          version="${TAG#v}"
          scripts/build-zip.sh "${version}" .
          node scripts/version.mjs notes "${version}" > release-notes.md
          printf 'asset=all-in-one-wp-migration-s3-client-extension-%s.zip\n' "${version}" >> "${GITHUB_OUTPUT}"
          printf 'checksum=all-in-one-wp-migration-s3-client-extension-%s.zip.sha256\n' "${version}" >> "${GITHUB_OUTPUT}"

      # The ZIP that CI tested was built from the PR branch and published as a
      # prerelease; this one is built from the merged tag. They must be identical,
      # otherwise something changed after testing and nothing is published.
      # A manual re-run (workflow_dispatch) may skip this: the prerelease is gone
      # after the first successful release.
      - name: Verify the release is the tested build
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          sha="$(git rev-list -n 1 "refs/tags/${TAG}")"
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/pulls" --jq '.[0].number // empty')"
          tested=''
          if [[ -n "${pr}" ]]; then
            tested="$(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep "^rc-pr${pr}-" | head -n 1 || true)"
          fi
          if [[ -z "${tested}" ]]; then
            if [[ "${EVENT}" == workflow_dispatch ]]; then
              echo '::warning::no tested prerelease found; skipping verification (manual run)'
              exit 0
            fi
            echo "::error::no tested prerelease found for ${TAG} (PR: ${pr:-none}); refusing to publish untested bytes" >&2
            exit 1
          fi
          mkdir tested
          gh release download "${tested}" --pattern '*.zip' --dir tested
          scripts/zip-diff.sh tested/*.zip "all-in-one-wp-migration-s3-client-extension-${TAG#v}.zip"
          echo "tested_tag=${tested}" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release create "${TAG}" \
            "${{ steps.package.outputs.asset }}" \
            "${{ steps.package.outputs.checksum }}" \
            --verify-tag \
            --notes-file release-notes.md \
            --title "${TAG}"

      - name: Remove the tested prerelease
        if: steps.verify.outputs.tested_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED: ${{ steps.verify.outputs.tested_tag }}
        run: gh release delete "${TESTED}" --cleanup-tag --yes
