name: Release WordPress plugin

# Triggered by a version tag. release-on-merge.yml pushes that tag with
# BOT_TOKEN after a release PR lands on main. Manual re-run: workflow_dispatch
# with an existing tag.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v1.59.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Validate tag and plugin versions
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Release tag must match vMAJOR.MINOR.PATCH: %s\n' "${TAG}" >&2
            exit 1
          fi
          node scripts/version.mjs check "${TAG#v}"

      - name: Lint PHP sources
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do
            php -l "${file}" >/dev/null
          done < <(find . -path './.git' -prune -o -name '*.php' -print0)

      - name: Build installable ZIP
        id: package
        shell: bash
        run: |
          set -Eeuo pipefail

          slug='all-in-one-wp-migration-s3-client-extension'
          version="${TAG#v}"
          asset="${slug}-${version}.zip"
          checksum="${asset}.sha256"
          stage="$(mktemp -d)"
          trap 'rm -rf "${stage}"' EXIT

          mkdir -p "${stage}/${slug}"
          rsync -a \
            --exclude='.git/' --exclude='.github/' \
            --exclude='scripts/' --exclude='tests/' --exclude='upstream/' --exclude='docs/' \
            ./ "${stage}/${slug}/"
          (
            cd "${stage}"
            zip -qr "${GITHUB_WORKSPACE}/${asset}" "${slug}"
          )

          unzip -tqq "${asset}"
          printf '%s  %s\n' "$(sha256sum "${asset}" | cut -d ' ' -f 1)" "${asset}" > "${checksum}"
          node scripts/version.mjs notes "${version}" > release-notes.md

          printf 'asset=%s\n' "${asset}" >> "${GITHUB_OUTPUT}"
          printf 'checksum=%s\n' "${checksum}" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release create "${TAG}" \
            "${{ steps.package.outputs.asset }}" \
            "${{ steps.package.outputs.checksum }}" \
            --verify-tag \
            --notes-file release-notes.md \
            --title "${TAG}"
