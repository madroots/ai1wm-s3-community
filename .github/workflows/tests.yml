name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly: catches base-plugin, WordPress image, or S3 server drift with no
  # code change on our side.
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint and PHP ${{ matrix.php }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          tools: phpcs

      - name: Lint
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do
            php -l "${file}" >/dev/null
          done < <(find . -path './.git' -prune -o -name '*.php' -print0)

      - name: PHPCompatibility 7.4+
        if: matrix.php == '8.3'
        run: |
          set -Eeuo pipefail
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --quiet phpcompatibility/php-compatibility dealerdirect/phpcodesniffer-composer-installer
          phpcs -i
          phpcs --standard=tests/phpcs.xml --extensions=php --ignore='*/tests/*,*/scripts/*' .

      - name: Version declarations agree
        if: matrix.php == '8.3'
        run: node scripts/version.mjs check

  integration:
    name: WP integration (PHP ${{ matrix.php }}, base ${{ matrix.base }})
    runs-on: ubuntu-latest
    needs: static
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.3', base: latest }
          - { php: '7.4', base: '7.84' }
          - { php: '8.1', base: latest }
          - { php: '8.4', base: latest }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run suite
        env:
          PHP_VERSION: ${{ matrix.php }}
          AI1WM_VERSION: ${{ matrix.base }}
        run: tests/run.sh

  # Single required status check for branch protection and auto-merge.
  required:
    name: Required checks
    if: always()
    needs: [static, integration]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs succeeded
        run: |
          [[ "${{ needs.static.result }}" == success && "${{ needs.integration.result }}" == success ]]
